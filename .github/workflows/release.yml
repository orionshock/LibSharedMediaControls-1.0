name: Package and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require an annotated tag
        shell: bash
        run: test "$(git cat-file -t "$GITHUB_REF")" = tag
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
